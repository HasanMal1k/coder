syntax = "proto3";

package coder.guest.v1;

option go_package = "github.com/HasanMal1k/coder/internal/guestapi;guestapi";

// Guest is served by guestd inside every machine. The control plane is the
// client: it calls these RPCs over the tunnel guestd opened to it.
service Guest {
  // Terminal runs a shell on a PTY. The first input message must be start.
  // The stream ends after the guest sends exit_code, or when the client
  // closes it, which kills the shell.
  rpc Terminal(stream TerminalInput) returns (stream TerminalOutput);

  // Forward connects to a TCP port on the machine's loopback interface and
  // relays bytes both ways. The first request message must be open; the
  // guest answers with opened once connected, or fails the call if nothing
  // is listening. The client half-closing closes the write side of the TCP
  // connection; the stream ends when the machine's side closes.
  rpc Forward(stream ForwardRequest) returns (stream ForwardResponse);

  // Ping checks that the guest is alive.
  rpc Ping(PingRequest) returns (PingResponse);

  // PutFile writes a file on the machine, creating the folders it needs and
  // replacing a file already there. The file belongs to the machine's user.
  rpc PutFile(PutFileRequest) returns (PutFileResponse);

  // GetFile reads a file on the machine. A file larger than max_size is
  // refused with FAILED_PRECONDITION, a missing one with NOT_FOUND.
  rpc GetFile(GetFileRequest) returns (GetFileResponse);
}

message TerminalSize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message TerminalStart {
  TerminalSize size = 1;
}

message TerminalInput {
  oneof msg {
    TerminalStart start = 1;
    // data is bytes typed by the user, written to the shell's stdin.
    bytes data = 2;
    TerminalSize resize = 3;
  }
}

message TerminalOutput {
  oneof msg {
    // data is the shell's combined stdout and stderr.
    bytes data = 1;
    // exit_code is sent once, as the last message, when the shell exits.
    int32 exit_code = 2;
  }
}

message ForwardOpen {
  uint32 port = 1;
}

message ForwardOpened {}

message ForwardRequest {
  oneof msg {
    ForwardOpen open = 1;
    bytes data = 2;
  }
}

message ForwardResponse {
  oneof msg {
    ForwardOpened opened = 1;
    bytes data = 2;
  }
}

message PingRequest {}

message PingResponse {}

// A path is absolute, or relative to the home folder.
message PutFileRequest {
  string path = 1;
  bytes data = 2;
}

message PutFileResponse {
  // Where the file was written, as an absolute path.
  string path = 1;
}

message GetFileRequest {
  string path = 1;
  uint64 max_size = 2;
}

message GetFileResponse {
  bytes data = 1;
  // The path read, as an absolute path.
  string path = 2;
}
