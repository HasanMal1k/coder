# Local development dependencies. The server itself runs on the host
# (`make run`): it needs the Docker daemon to create machines.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coder}
      POSTGRES_DB: coder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder -d coder"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - -path=/migrations
      - -database=postgres://coder:${POSTGRES_PASSWORD:-coder}@postgres:5432/coder?sslmode=disable
      - up
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
